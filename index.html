<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🌌 AstroJob — Personal Job Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app/board.css?v=20260904-5" />
</head>
<body><div class="stars"></div><div class="planet planet-one"></div><div class="planet planet-two"></div>
  <div class="satellite-flight" aria-hidden="true" style="position:fixed;left:-140px;bottom:-100px;width:110px;height:72px;pointer-events:none;">
    <svg class="satellite" viewBox="0 0 140 90" width="110" height="72" role="presentation" style="width:110px;height:72px;display:block;">
      <defs>
        <linearGradient id="satBody" x1="0" x2="1"><stop offset="0" stop-color="#d9d5ef"/><stop offset="1" stop-color="#8576ba"/></linearGradient>
        <linearGradient id="satPanel" x1="0" x2="1"><stop offset="0" stop-color="#7b63cf"/><stop offset="1" stop-color="#35285f"/></linearGradient>
      </defs>
      <g transform="translate(70 45) rotate(-18)">
        <rect x="-22" y="-12" width="44" height="24" rx="7" fill="url(#satBody)" stroke="#f1c7ee" stroke-opacity=".45"/>
        <circle cx="0" cy="0" r="8" fill="#2f2748" stroke="#c9b9ff" stroke-width="2"/>
        <rect x="-61" y="-15" width="31" height="30" rx="3" fill="url(#satPanel)" stroke="#b8a8ff" stroke-opacity=".5"/>
        <rect x="30" y="-15" width="31" height="30" rx="3" fill="url(#satPanel)" stroke="#b8a8ff" stroke-opacity=".5"/>
        <path d="M-30 0H-22M22 0H30M0-12V-25" stroke="#d6cff4" stroke-width="3" stroke-linecap="round"/>
        <circle cx="0" cy="-29" r="5" fill="#f0b7dc"/>
      </g>
    </svg>
  </div>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow astro-title">ASTROJOB</div>
        <p class="subtitle astro-tagline">Built around one candidate. Designed around what matters.</p>
      </div>
      <div class="top-actions">
        <button id="addJobButton" class="button primary">＋ Add job</button>
        <button id="exportButton" class="button secondary">Export backup</button>
        <button id="importButton" class="button secondary">Import</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </header>
    <section class="stats" id="stats" aria-label="Board summary"></section>
    <section class="controls">
      <label class="search-wrap"><span class="sr-only">Search jobs</span><input id="searchInput" type="search" placeholder="Search title, company, city…" /></label>
      <select id="decisionFilter" aria-label="Filter by decision">
        <option value="all">All recommendations</option><option value="APPLY_NOW">Apply now</option><option value="APPLY">Apply</option><option value="STRETCH">Stretch</option><option value="MAYBE">Maybe</option><option value="REJECT">Rejected by rules</option>
      </select>
      <select id="countryFilter" aria-label="Filter by country"><option value="all">All countries</option></select>
      <select id="sortBy" aria-label="Sort jobs"><option value="priority">Highest priority</option><option value="fit">Highest fit</option><option value="newest">Newest found</option></select>
    </section>
    <nav class="tabs" id="tabs" aria-label="Application status"></nav>
    <section id="jobsGrid" class="jobs-grid" aria-live="polite"></section>
    <div id="emptyState" class="empty-state" hidden>
      <strong>No jobs here yet.</strong>
      <span>Add a role and AstroJob will score it against your profile and hard rules.</span>
      <button id="emptyAddButton" class="button primary">＋ Add your first job</button>
      <button id="loadDemoButton" class="button secondary">Load demo jobs</button>
    </div>
  </main>
  <template id="jobCardTemplate">
    <article class="job-card">
      <div class="card-head">
        <div class="company-mark" aria-hidden="true"></div>
        <div class="job-title-wrap"><div class="job-company"></div><h2 class="job-title"></h2><div class="job-meta"></div></div>
        <div class="badge-stack"><div class="taxonomy-badge"></div><div class="priority-badge"></div></div>
      </div>
      <div class="scores"><div class="score"><span>Fit</span><strong class="fit-score"></strong></div><div class="score"><span>Desirability</span><strong class="desirability-score"></strong></div><div class="score"><span>Priority</span><strong class="priority-score"></strong></div></div>
      <div class="salary-row"></div><div class="flags"></div>
      <details class="match-details"><summary>Why this match</summary><div class="details-grid"><div><h3>Strong signals</h3><ul class="reasons-list"></ul></div><div><h3>Watch-outs</h3><ul class="gaps-list"></ul></div></div></details>
      <div class="job-notes-preview"></div>
      <div class="card-actions">
        <a class="button primary apply-link" target="_blank" rel="noopener">Open job</a>
        <button class="button secondary edit-job">Edit</button>
        <select class="status-select" aria-label="Update job status">
          <option value="new">New</option><option value="saved">Saved</option><option value="applied">Applied</option><option value="screening">Screening</option><option value="interview">Interview</option><option value="offer">Offer</option><option value="rejected">Rejected / Skipped</option><option value="withdrawn">Withdrawn</option>
        </select>
      </div>
    </article>
  </template>

  <dialog id="jobDialog" class="job-dialog">
    <form id="jobForm" method="dialog">
      <div class="dialog-head">
        <div>
          <div class="eyebrow">ASTROJOB INPUT</div>
          <h2 id="dialogTitle">Add a job</h2>
        </div>
        <button type="button" id="closeDialog" class="icon-button" aria-label="Close">×</button>
      </div>

      <input type="hidden" id="jobId">
      <div class="form-grid">
        <label class="wide">Job URL<input id="jobUrl" type="url" placeholder="https://..." /></label>
        <label>Job title<input id="jobTitle" required /></label>
        <label>Company<input id="jobCompany" required /></label>
        <label>Country<input id="jobCountry" required placeholder="Poland" /></label>
        <label>City<input id="jobCity" placeholder="Warsaw" /></label>
        <label>Work model<select id="jobWorkModel"><option>On-site</option><option>Hybrid</option><option selected>Remote</option></select></label>
        <label>Posted date<input id="jobPostedAt" type="date" /></label>
        <label>Renewed / reposted<input id="jobRenewedAt" type="date" /></label>
        <label>Salary currency<select id="jobCurrency"><option value="">Undisclosed</option><option>PLN</option><option>EUR</option><option>USD</option><option>GBP</option></select></label>
        <label>Monthly gross<input id="jobMonthly" type="number" min="0" step="1" placeholder="10000" /></label>
        <label>Annual gross<input id="jobAnnual" type="number" min="0" step="1" placeholder="120000" /></label>
        <label>Personal interest<select id="jobInterest"><option value="love">Love this</option><option value="positive" selected>Interested</option><option value="neutral">Neutral</option><option value="low">Not excited</option></select></label>
        <label>Next action date<input id="jobNextAction" type="date" /></label>
        <label class="wide">Languages mentioned<input id="jobLanguages" placeholder="English, Romanian" /></label>
        <label class="wide">Description / requirements<textarea id="jobDescription" rows="8" placeholder="Paste the job description here. AstroJob scores this text."></textarea></label>
        <label class="wide">Your notes<textarea id="jobNotes" rows="4" placeholder="Recruiter, salary discussion, interview notes, concerns, follow-up..."></textarea></label>
      </div>
      <div class="dialog-score" id="dialogScore">Fill in the role and AstroJob will score it when you save.</div>
      <div class="dialog-actions">
        <button type="button" id="deleteJobButton" class="button danger" hidden>Delete</button>
        <div class="dialog-actions-right">
          <button type="button" id="cancelDialog" class="button secondary">Cancel</button>
          <button type="submit" class="button primary">Save & score</button>
        </div>
      </div>
    </form>
  </dialog>

  <script type="module" src="app/board.js?v=20260904-2"></script>
</body>
</html>
